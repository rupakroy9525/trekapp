{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h2 class="display-title mb-4">My Profile</h2>

<form method="post" class="card-trek p-4" style="max-width: 480px;">
  <div class="mb-3">
    <label class="form-label">Full name</label>
    <input type="text" class="form-control" name="name" value="{{ current_user.name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
    <div class="form-text">Email cannot be changed.</div>
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="text" class="form-control" name="phone" value="{{ current_user.phone or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">New password <span class="text-muted small">(leave blank to keep current)</span></label>
    <input type="password" class="form-control" name="new_password" minlength="6">
  </div>
  <button type="submit" class="btn btn-forest w-100">Save Changes</button>
</form>
{% endblock %}
